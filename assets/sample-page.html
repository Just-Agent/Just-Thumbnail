<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Just Thumbnail Sample</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f8fb;
        color: #10213d;
      }

      body {
        margin: 0;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 48px;
        align-items: center;
        padding: 64px;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 7vw, 92px);
        line-height: 0.95;
      }

      p {
        max-width: 620px;
        color: #53627a;
        font-size: 20px;
        line-height: 1.65;
      }

      .panel {
        min-height: 520px;
        border: 1px solid #d9e1ee;
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 0 30px 80px rgba(25, 42, 70, 0.12);
        padding: 28px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid #edf1f7;
        padding: 18px 0;
        font-weight: 700;
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        font-weight: 800;
      }

      .dot {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: #23b26d;
      }

      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
          padding: 28px;
        }

        .panel {
          min-height: 360px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="mark"><span class="dot"></span>JUST-DDL NETWORK</div>
        <h1>One website. Every thumbnail.</h1>
        <p>Generate responsive device previews, social cards, square covers, and vertical posters from the same rendered page.</p>
      </section>
      <section class="panel" aria-label="Sample dashboard">
        <div class="row"><span>Responsive fleet</span><span>44</span></div>
        <div class="row"><span>Open Graph card</span><span>18</span></div>
        <div class="row"><span>Square post</span><span>12</span></div>
        <div class="row"><span>Story poster</span><span>5</span></div>
      </section>
    </main>
  </body>
</html>
