<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Just Thumbnail</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef3f8;
        --panel: #ffffff;
        --ink: #10213d;
        --muted: #64748b;
        --line: #dbe4ef;
        --accent: #20a96b;
        --blue: #2878d8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
      }

      aside {
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.74);
        padding: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        font-weight: 850;
      }

      .mark {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 7px rgba(32, 169, 107, 0.12);
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
      }

      label {
        color: #304158;
        font-size: 13px;
        font-weight: 750;
      }

      input[type="text"],
      input[type="url"] {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 0 12px;
        outline: none;
      }

      input[type="file"] {
        width: 100%;
        border: 1px dashed #b8c5d5;
        border-radius: 8px;
        background: #fff;
        padding: 12px;
        color: var(--muted);
      }

      .segments {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .segments button,
      .actions button {
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: #25364b;
        cursor: pointer;
        font-weight: 750;
      }

      .segments button[aria-pressed="true"] {
        border-color: rgba(32, 169, 107, 0.4);
        background: rgba(32, 169, 107, 0.12);
        color: #11623e;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 22px;
      }

      .actions button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .status {
        min-height: 42px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      main {
        min-width: 0;
        padding: 30px;
        display: grid;
        place-items: center;
      }

      .stage-wrap {
        position: relative;
        width: min(100%, 1160px);
        aspect-ratio: 5 / 3;
        overflow: hidden;
      }

      .stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1600px;
        height: 960px;
        overflow: hidden;
        transform: translate(-50%, -50%) scale(var(--scale, 0.7));
        transform-origin: center;
        border-radius: 18px;
        background:
          radial-gradient(circle at 28% 18%, rgba(35, 178, 109, 0.18), transparent 30%),
          radial-gradient(circle at 82% 18%, rgba(25, 135, 212, 0.16), transparent 32%),
          linear-gradient(180deg, #f8fbff 0%, #e8eef5 100%);
        box-shadow: 0 30px 100px rgba(17, 31, 52, 0.18);
      }

      .stage.square {
        width: 1080px;
        height: 1080px;
      }

      .stage.og {
        width: 1200px;
        height: 630px;
      }

      .stage.story {
        width: 1080px;
        height: 1920px;
      }

      .stage-brand,
      .stage-title,
      .stage-source {
        position: absolute;
        z-index: 5;
      }

      .stage-brand {
        left: 56px;
        top: 42px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #173a68;
        font-size: 16px;
        font-weight: 850;
      }

      .stage-brand::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 6px rgba(35, 178, 109, 0.12);
      }

      .stage-title {
        left: 56px;
        top: 86px;
        width: 520px;
        margin: 0;
        font-size: 54px;
        line-height: 1;
        letter-spacing: 0;
      }

      .stage-source {
        left: 58px;
        top: 210px;
        color: var(--muted);
        font-size: 18px;
        font-weight: 650;
      }

      .device {
        position: absolute;
        background: #0b1018;
        box-shadow: 0 36px 90px rgba(18, 31, 50, 0.26);
      }

      .screen {
        position: absolute;
        inset: 13px;
        overflow: hidden;
        background: #fff;
      }

      .screen iframe,
      .screen img {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        object-fit: cover;
        object-position: top center;
        background: #fff;
      }

      .desktop {
        left: 575px;
        top: 185px;
        width: 650px;
        height: 420px;
        border-radius: 18px;
      }

      .desktop::after {
        content: "";
        position: absolute;
        left: 255px;
        top: 420px;
        width: 140px;
        height: 118px;
        background: linear-gradient(180deg, #dfe5ec, #aab4c0);
        clip-path: polygon(32% 0, 68% 0, 92% 100%, 8% 100%);
      }

      .desktop::before {
        content: "";
        position: absolute;
        left: 200px;
        top: 532px;
        width: 250px;
        height: 18px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(80, 93, 110, 0.5), transparent);
        filter: blur(2px);
      }

      .laptop {
        left: 980px;
        top: 485px;
        width: 400px;
        height: 254px;
        border-radius: 13px;
      }

      .laptop::after {
        content: "";
        position: absolute;
        left: -36px;
        right: -36px;
        bottom: -18px;
        height: 18px;
        border-radius: 0 0 28px 28px;
        background: linear-gradient(180deg, #dce3ec, #98a4b2);
      }

      .tablet {
        left: 315px;
        top: 500px;
        width: 350px;
        height: 260px;
        border-radius: 20px;
      }

      .phone {
        left: 672px;
        top: 650px;
        width: 142px;
        height: 252px;
        border-radius: 25px;
      }

      .phone .screen {
        inset: 11px 8px;
        border-radius: 18px;
      }

      .stage.og .stage-title,
      .stage.square .stage-title,
      .stage.story .stage-title {
        width: auto;
      }

      .solo {
        position: absolute;
        overflow: hidden;
        border: 1px solid rgba(142, 157, 176, 0.3);
        background: #fff;
        box-shadow: 0 36px 90px rgba(18, 31, 50, 0.18);
      }

      .solo .screen {
        inset: 0;
      }

      .og .solo {
        left: 515px;
        top: 72px;
        width: 610px;
        height: 486px;
        border-radius: 34px;
      }

      .og .solo .screen {
        left: 26px;
        top: 26px;
        width: 558px;
        height: 316px;
        border-radius: 18px;
      }

      .og .stage-title {
        left: 550px;
        top: 430px;
        right: 82px;
        font-size: 42px;
      }

      .og .stage-source {
        left: 552px;
        top: 520px;
        font-size: 20px;
      }

      .square .solo {
        left: 156px;
        top: 260px;
        width: 768px;
        height: 480px;
        border-radius: 28px;
      }

      .square .stage-title {
        left: 76px;
        top: 72px;
        right: 76px;
        font-size: 64px;
      }

      .square .stage-source {
        left: 80px;
        top: 810px;
        font-size: 26px;
      }

      .story .solo {
        left: 188px;
        top: 510px;
        width: 704px;
        height: 1040px;
        border-radius: 44px;
      }

      .story .stage-title {
        left: 84px;
        top: 92px;
        right: 84px;
        font-size: 92px;
      }

      .story .stage-source {
        left: 88px;
        top: 320px;
        right: 88px;
        font-size: 34px;
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        main {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand"><span class="mark"></span><span>Just Thumbnail</span></div>
        <div class="field">
          <label for="url">URL</label>
          <input id="url" type="text" value="demo.html" />
        </div>
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" value="Just Thumbnail" />
        </div>
        <div class="field">
          <label for="file">Screenshot</label>
          <input id="file" type="file" accept="image/*" />
        </div>
        <div class="field">
          <label>Preset</label>
          <div class="segments" id="presets">
            <button type="button" data-preset="responsive" aria-pressed="true">Responsive</button>
            <button type="button" data-preset="og" aria-pressed="false">OG</button>
            <button type="button" data-preset="square" aria-pressed="false">Square</button>
            <button type="button" data-preset="story" aria-pressed="false">Story</button>
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="button" id="load">Load URL</button>
          <button type="button" id="export">Export PNG</button>
        </div>
        <div class="status" id="status">Ready.</div>
      </aside>
      <main>
        <div class="stage-wrap">
          <section class="stage" id="stage" aria-label="Thumbnail preview">
            <div class="stage-brand">JUST-THUMBNAIL</div>
            <h1 class="stage-title" id="stageTitle">Just Thumbnail</h1>
            <div class="stage-source" id="stageSource">demo.html</div>
            <section class="device desktop" data-device="desktop"><div class="screen"></div></section>
            <section class="device tablet" data-device="tablet"><div class="screen"></div></section>
            <section class="device phone" data-device="phone"><div class="screen"></div></section>
            <section class="device laptop" data-device="laptop"><div class="screen"></div></section>
          </section>
        </div>
      </main>
    </div>
    <script>
      const stage = document.querySelector("#stage");
      const titleInput = document.querySelector("#title");
      const urlInput = document.querySelector("#url");
      const fileInput = document.querySelector("#file");
      const status = document.querySelector("#status");
      const stageTitle = document.querySelector("#stageTitle");
      const stageSource = document.querySelector("#stageSource");
      const presets = document.querySelector("#presets");
      const stageWrap = document.querySelector(".stage-wrap");

      let preset = "responsive";
      let uploadedImage = "";
      let mode = "url";

      const sizes = {
        responsive: [1600, 960],
        og: [1200, 630],
        square: [1080, 1080],
        story: [1080, 1920]
      };

      function normalizeUrl(value) {
        if (/^https?:\/\//i.test(value)) return value;
        if (/^(\.?\/|\/)/.test(value) || /\.html?($|[?#])/i.test(value)) return new URL(value, location.href).href;
        return `https://${value.replace(/^\/+/, "")}`;
      }

      function hostname(value) {
        try {
          const url = new URL(normalizeUrl(value));
          if (url.origin === location.origin || url.protocol === "file:") {
            return url.pathname.split("/").filter(Boolean).pop() || url.hostname || "demo";
          }
          return url.hostname.replace(/^www\./, "");
        } catch {
          return value;
        }
      }

      function setStatus(text) {
        status.textContent = text;
      }

      function updateText() {
        stageTitle.textContent = titleInput.value.trim() || "Just Thumbnail";
        stageSource.textContent = hostname(urlInput.value.trim() || "example.com");
      }

      function screenMarkup() {
        if (uploadedImage) return `<img src="${uploadedImage}" alt="">`;
        const src = normalizeUrl(urlInput.value.trim() || "https://example.com");
        return `<iframe src="${src}" loading="lazy" referrerpolicy="no-referrer"></iframe>`;
      }

      function renderResponsive() {
        stage.innerHTML = `
          <div class="stage-brand">JUST-THUMBNAIL</div>
          <h1 class="stage-title" id="stageTitle">${escapeHtml(titleInput.value.trim() || "Just Thumbnail")}</h1>
          <div class="stage-source" id="stageSource">${escapeHtml(hostname(urlInput.value.trim() || "example.com"))}</div>
          <section class="device desktop"><div class="screen">${screenMarkup()}</div></section>
          <section class="device tablet"><div class="screen">${screenMarkup()}</div></section>
          <section class="device phone"><div class="screen">${screenMarkup()}</div></section>
          <section class="device laptop"><div class="screen">${screenMarkup()}</div></section>
        `;
      }

      function renderSolo() {
        stage.innerHTML = `
          <div class="stage-brand">JUST-THUMBNAIL</div>
          <section class="solo"><div class="screen">${screenMarkup()}</div></section>
          <h1 class="stage-title" id="stageTitle">${escapeHtml(titleInput.value.trim() || "Just Thumbnail")}</h1>
          <div class="stage-source" id="stageSource">${escapeHtml(hostname(urlInput.value.trim() || "example.com"))}</div>
        `;
      }

      function render() {
        stage.className = `stage ${preset === "responsive" ? "" : preset}`.trim();
        const [width, height] = sizes[preset];
        stage.style.width = `${width}px`;
        stage.style.height = `${height}px`;
        stageWrap.style.aspectRatio = `${width} / ${height}`;
        if (preset === "responsive") renderResponsive();
        else renderSolo();
        fitStage();
      }

      function fitStage() {
        const [width, height] = sizes[preset];
        const available = stageWrap.getBoundingClientRect();
        const scale = Math.min(available.width / width, available.height / height, 1);
        stage.style.setProperty("--scale", scale.toFixed(4));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      presets.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-preset]");
        if (!button) return;
        preset = button.dataset.preset;
        presets.querySelectorAll("button").forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        render();
      });

      document.querySelector("#load").addEventListener("click", () => {
        mode = "url";
        uploadedImage = "";
        render();
        setStatus("URL preview loaded.");
      });

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];
        if (!file) return;
        uploadedImage = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result));
          reader.readAsDataURL(file);
        });
        mode = "image";
        render();
        setStatus("Screenshot loaded.");
      });

      titleInput.addEventListener("input", render);
      urlInput.addEventListener("input", updateText);
      window.addEventListener("resize", fitStage);

      document.querySelector("#export").addEventListener("click", async () => {
        if (mode === "image" && uploadedImage) {
          await exportFromCanvas();
          return;
        }
        await exportFromTabCapture();
      });

      async function exportFromCanvas() {
        const [width, height] = sizes[preset];
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        const img = await loadImage(uploadedImage);
        paintBackground(ctx, width, height);
        if (preset === "responsive") paintResponsive(ctx, img);
        else paintSolo(ctx, img, preset);
        canvas.toBlob(downloadBlob, "image/png");
      }

      async function exportFromTabCapture() {
        if (!navigator.mediaDevices?.getDisplayMedia) {
          setStatus("This browser cannot capture the current tab.");
          return;
        }
        setStatus("Select this tab, then keep it visible for one second.");
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { displaySurface: "browser", preferCurrentTab: true },
          audio: false
        });
        const video = document.createElement("video");
        video.srcObject = stream;
        await video.play();
        await new Promise((resolve) => setTimeout(resolve, 700));
        const rect = stage.getBoundingClientRect();
        const scaleX = video.videoWidth / window.innerWidth;
        const scaleY = video.videoHeight / window.innerHeight;
        const [width, height] = sizes[preset];
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(
          video,
          rect.left * scaleX,
          rect.top * scaleY,
          rect.width * scaleX,
          rect.height * scaleY,
          0,
          0,
          width,
          height
        );
        stream.getTracks().forEach((track) => track.stop());
        canvas.toBlob(downloadBlob, "image/png");
        setStatus("PNG exported.");
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      function paintBackground(ctx, width, height) {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#f8fbff");
        gradient.addColorStop(1, "#e8eef5");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "rgba(35, 178, 109, 0.12)";
        ctx.beginPath();
        ctx.arc(width * 0.28, height * 0.18, width * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(25, 135, 212, 0.12)";
        ctx.beginPath();
        ctx.arc(width * 0.82, height * 0.18, width * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#173a68";
        ctx.font = "800 16px system-ui";
        ctx.fillText("JUST-THUMBNAIL", 56, 58);
        ctx.fillStyle = "#0c2345";
        ctx.font = "800 54px system-ui";
        wrapText(ctx, titleInput.value.trim() || "Just Thumbnail", 56, 132, 520, 58);
        ctx.fillStyle = "#64748b";
        ctx.font = "650 18px system-ui";
        ctx.fillText(hostname(urlInput.value.trim() || "example.com"), 58, 232);
      }

      function paintResponsive(ctx, img) {
        drawDevice(ctx, img, 575, 185, 650, 420, 18);
        drawDevice(ctx, img, 315, 500, 350, 260, 20);
        drawDevice(ctx, img, 672, 650, 142, 252, 25);
        drawDevice(ctx, img, 980, 485, 400, 254, 13);
      }

      function paintSolo(ctx, img, kind) {
        const frames = {
          og: [541, 98, 558, 316, 18],
          square: [156, 260, 768, 480, 28],
          story: [188, 510, 704, 1040, 44]
        };
        const [x, y, w, h, r] = frames[kind];
        drawRoundedImage(ctx, img, x, y, w, h, r);
      }

      function drawDevice(ctx, img, x, y, w, h, r) {
        roundedRect(ctx, x, y, w, h, r);
        ctx.fillStyle = "#0b1018";
        ctx.fill();
        drawRoundedImage(ctx, img, x + 13, y + 13, w - 26, h - 26, Math.max(2, r - 8));
      }

      function drawRoundedImage(ctx, img, x, y, w, h, r) {
        ctx.save();
        roundedRect(ctx, x, y, w, h, r);
        ctx.clip();
        const scale = Math.max(w / img.width, h / img.height);
        const sw = w / scale;
        const sh = h / scale;
        const sx = (img.width - sw) / 2;
        ctx.drawImage(img, sx, 0, sw, sh, x, y, w, h);
        ctx.restore();
      }

      function roundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(/\s+/);
        let line = "";
        for (const word of words) {
          const test = line ? `${line} ${word}` : word;
          if (ctx.measureText(test).width > maxWidth && line) {
            ctx.fillText(line, x, y);
            line = word;
            y += lineHeight;
          } else {
            line = test;
          }
        }
        ctx.fillText(line, x, y);
      }

      function downloadBlob(blob) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `just-thumbnail-${preset}.png`;
        a.click();
        URL.revokeObjectURL(a.href);
        setStatus("PNG exported.");
      }

      render();
    </script>
  </body>
</html>
