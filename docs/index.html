<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Just Thumbnail</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef3f8;
        --panel: #ffffff;
        --ink: #10213d;
        --muted: #64748b;
        --line: #dbe4ef;
        --accent: #20a96b;
        --blue: #2878d8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
      }

      aside {
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.74);
        padding: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        font-weight: 850;
      }

      .mark {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 7px rgba(32, 169, 107, 0.12);
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
      }

      label {
        color: #304158;
        font-size: 13px;
        font-weight: 750;
      }

      input[type="text"],
      input[type="url"] {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 0 12px;
        outline: none;
      }

      input[type="file"] {
        width: 100%;
        border: 1px dashed #b8c5d5;
        border-radius: 8px;
        background: #fff;
        padding: 12px;
        color: var(--muted);
      }

      .segments {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .checks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .checks label {
        min-height: 38px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 0 10px;
        color: #25364b;
        cursor: pointer;
      }

      .checks input {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
      }

      .segments button,
      .actions button {
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: #25364b;
        cursor: pointer;
        font-weight: 750;
      }

      .segments button[aria-pressed="true"] {
        border-color: rgba(32, 169, 107, 0.4);
        background: rgba(32, 169, 107, 0.12);
        color: #11623e;
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 22px;
      }

      .actions button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .status {
        min-height: 42px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      main {
        min-width: 0;
        padding: 30px;
        display: grid;
        place-items: center;
      }

      .stage-wrap {
        position: relative;
        width: min(100%, 1160px);
        aspect-ratio: 5 / 3;
        overflow: hidden;
      }

      .stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1600px;
        height: 960px;
        overflow: hidden;
        transform: translate(-50%, -50%) scale(var(--scale, 0.7));
        transform-origin: center;
        border-radius: 18px;
        background:
          radial-gradient(circle at 28% 18%, rgba(35, 178, 109, 0.18), transparent 30%),
          radial-gradient(circle at 82% 18%, rgba(25, 135, 212, 0.16), transparent 32%),
          linear-gradient(180deg, #f8fbff 0%, #e8eef5 100%);
        box-shadow: 0 30px 100px rgba(17, 31, 52, 0.18);
      }

      .stage.square {
        width: 1080px;
        height: 1080px;
      }

      .stage.og {
        width: 1200px;
        height: 630px;
      }

      .stage.matrix {
        width: 1200px;
        height: 675px;
      }

      .stage.story {
        width: 1080px;
        height: 1920px;
      }

      .stage.app {
        width: 1024px;
        height: 1024px;
      }

      .stage-brand,
      .stage-title,
      .stage-source {
        position: absolute;
        z-index: 5;
      }

      .stage-brand {
        left: 56px;
        top: 42px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #173a68;
        font-size: 16px;
        font-weight: 850;
      }

      .stage-brand::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 6px rgba(35, 178, 109, 0.12);
      }

      .stage-title {
        left: 56px;
        top: 86px;
        width: 520px;
        margin: 0;
        font-size: 54px;
        line-height: 1;
        letter-spacing: 0;
      }

      .stage-source {
        left: 58px;
        top: 210px;
        color: var(--muted);
        font-size: 18px;
        font-weight: 650;
      }

      .device {
        position: absolute;
        background: #0b1018;
        box-shadow: 0 36px 90px rgba(18, 31, 50, 0.26);
      }

      .screen {
        position: absolute;
        inset: 13px;
        overflow: hidden;
        background: #fff;
      }

      .screen img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        object-position: top center;
        background: #fff;
      }

      .screen iframe {
        position: absolute;
        left: 0;
        top: 0;
        border: 0;
        background: #fff;
        transform-origin: top left;
      }

      .desktop {
        left: 650px;
        top: 145px;
        width: 650px;
        height: 420px;
        border-radius: 18px;
      }

      .desktop::after {
        content: "";
        position: absolute;
        left: 255px;
        top: 420px;
        width: 140px;
        height: 118px;
        background: linear-gradient(180deg, #dfe5ec, #aab4c0);
        clip-path: polygon(32% 0, 68% 0, 92% 100%, 8% 100%);
      }

      .desktop::before {
        content: "";
        position: absolute;
        left: 200px;
        top: 532px;
        width: 250px;
        height: 18px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(80, 93, 110, 0.5), transparent);
        filter: blur(2px);
      }

      .laptop {
        left: 955px;
        top: 635px;
        width: 400px;
        height: 254px;
        border-radius: 13px;
      }

      .laptop::after {
        content: "";
        position: absolute;
        left: -36px;
        right: -36px;
        bottom: -18px;
        height: 18px;
        border-radius: 0 0 28px 28px;
        background: linear-gradient(180deg, #dce3ec, #98a4b2);
      }

      .tablet {
        left: 390px;
        top: 635px;
        width: 350px;
        height: 260px;
        border-radius: 20px;
      }

      .phone {
        left: 775px;
        top: 645px;
        width: 142px;
        height: 252px;
        border-radius: 25px;
      }

      .phone .screen {
        inset: 11px 8px;
        border-radius: 18px;
      }

      .stage.og .stage-title,
      .stage.matrix .stage-title,
      .stage.square .stage-title,
      .stage.app .stage-title,
      .stage.story .stage-title {
        width: auto;
      }

      .solo {
        position: absolute;
        overflow: hidden;
        border: 1px solid rgba(142, 157, 176, 0.3);
        background: #fff;
        box-shadow: 0 36px 90px rgba(18, 31, 50, 0.18);
      }

      .solo .screen {
        inset: 0;
      }

      .og .solo {
        left: 515px;
        top: 72px;
        width: 610px;
        height: 486px;
        border-radius: 34px;
      }

      .og .solo .screen {
        left: 26px;
        top: 26px;
        width: 558px;
        height: 316px;
        border-radius: 18px;
      }

      .og .stage-title {
        left: 550px;
        top: 430px;
        right: 82px;
        font-size: 42px;
      }

      .og .stage-source {
        left: 552px;
        top: 520px;
        font-size: 20px;
      }

      .matrix .solo {
        left: 42px;
        top: 42px;
        width: 1116px;
        height: 591px;
        border-radius: 30px;
      }

      .matrix .solo .screen {
        left: 28px;
        top: 28px;
        width: 1060px;
        height: 408px;
        border-radius: 18px;
      }

      .matrix .solo .screen img,
      .matrix .solo .screen iframe {
        object-fit: cover;
      }

      .matrix .stage-title {
        left: 78px;
        top: 506px;
        right: 280px;
        font-size: 46px;
        overflow-wrap: anywhere;
      }

      .matrix .stage-source {
        left: 80px;
        top: 590px;
        font-size: 20px;
      }

      .square .solo {
        left: 156px;
        top: 260px;
        width: 768px;
        height: 480px;
        border-radius: 28px;
      }

      .square .stage-title {
        left: 76px;
        top: 72px;
        right: 76px;
        font-size: 64px;
      }

      .square .stage-source {
        left: 80px;
        top: 810px;
        font-size: 26px;
      }

      .app .solo {
        left: 650px;
        top: 190px;
        width: 238px;
        height: 560px;
        border-radius: 42px;
      }

      .app .solo .screen {
        inset: 0;
        border-radius: 42px;
      }

      .app .stage-title {
        left: 142px;
        top: 174px;
        right: 510px;
        font-size: 52px;
        overflow-wrap: anywhere;
      }

      .app .stage-source {
        left: 146px;
        top: 374px;
        right: 560px;
        font-size: 28px;
        line-height: 1.25;
      }

      .app::after {
        content: "APP OUTPUT";
        position: absolute;
        left: 146px;
        bottom: 170px;
        display: inline-flex;
        align-items: center;
        height: 46px;
        padding: 0 18px;
        border: 1px solid rgba(142, 157, 176, 0.45);
        border-radius: 999px;
        color: #173a68;
        background: #eef6ff;
        font-size: 16px;
        font-weight: 850;
        letter-spacing: 0.08em;
      }

      .story .solo {
        left: 188px;
        top: 510px;
        width: 704px;
        height: 1040px;
        border-radius: 44px;
      }

      .story .stage-title {
        left: 84px;
        top: 92px;
        right: 84px;
        font-size: 92px;
      }

      .story .stage-source {
        left: 88px;
        top: 320px;
        right: 88px;
        font-size: 34px;
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        main {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand"><span class="mark"></span><span>Just Thumbnail</span></div>
        <div class="field">
          <label for="url">URL</label>
          <input id="url" type="text" value="demo.html" />
        </div>
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" value="Just Thumbnail" />
        </div>
        <div class="field">
          <label for="file">Screenshot</label>
          <input id="file" type="file" accept="image/*" />
        </div>
        <div class="field">
          <label>Preset</label>
          <div class="segments" id="presets">
            <button type="button" data-preset="responsive" aria-pressed="true">Responsive</button>
            <button type="button" data-preset="matrix" aria-pressed="false">Matrix</button>
            <button type="button" data-preset="og" aria-pressed="false">OG</button>
            <button type="button" data-preset="square" aria-pressed="false">Square</button>
            <button type="button" data-preset="app" aria-pressed="false">App</button>
            <button type="button" data-preset="story" aria-pressed="false">Story</button>
          </div>
        </div>
        <div class="field" id="deviceField">
          <label>Devices</label>
          <div class="checks" id="deviceChecks">
            <label><input type="checkbox" value="desktop" checked />Desktop</label>
            <label><input type="checkbox" value="laptop" checked />Laptop</label>
            <label><input type="checkbox" value="tablet" checked />iPad</label>
            <label><input type="checkbox" value="phone" checked />Phone</label>
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="button" id="load">Load URL</button>
          <button type="button" id="export">Export PNG</button>
        </div>
        <div class="status" id="status">Ready.</div>
      </aside>
      <main>
        <div class="stage-wrap">
          <section class="stage" id="stage" aria-label="Thumbnail preview">
            <div class="stage-brand">JUST-THUMBNAIL</div>
            <h1 class="stage-title" id="stageTitle">Just Thumbnail</h1>
            <div class="stage-source" id="stageSource">demo.html</div>
            <section class="device desktop" data-device="desktop"><div class="screen"></div></section>
            <section class="device tablet" data-device="tablet"><div class="screen"></div></section>
            <section class="device phone" data-device="phone"><div class="screen"></div></section>
            <section class="device laptop" data-device="laptop"><div class="screen"></div></section>
          </section>
        </div>
      </main>
    </div>
    <script>
      const stage = document.querySelector("#stage");
      const titleInput = document.querySelector("#title");
      const urlInput = document.querySelector("#url");
      const fileInput = document.querySelector("#file");
      const status = document.querySelector("#status");
      const stageTitle = document.querySelector("#stageTitle");
      const stageSource = document.querySelector("#stageSource");
      const presets = document.querySelector("#presets");
      const stageWrap = document.querySelector(".stage-wrap");
      const deviceChecks = document.querySelector("#deviceChecks");
      const deviceField = document.querySelector("#deviceField");

      let preset = "responsive";
      let uploadedImage = "";
      let mode = "url";

      const sizes = {
        responsive: [1600, 960],
        matrix: [1200, 675],
        og: [1200, 630],
        square: [1080, 1080],
        app: [1024, 1024],
        story: [1080, 1920]
      };

      const deviceViewports = {
        desktop: [1440, 900],
        laptop: [1280, 800],
        tablet: [820, 1180],
        phone: [390, 844]
      };

      const deviceDims = {
        desktop: { width: 650, height: 420 },
        laptop: { width: 400, height: 254 },
        tablet: { width: 350, height: 260 },
        phone: { width: 142, height: 252 }
      };

      function selectedDevices() {
        const checked = [...deviceChecks.querySelectorAll("input:checked")].map((input) => input.value);
        return checked.length ? checked : ["desktop"];
      }

      function normalizeUrl(value) {
        if (/^https?:\/\//i.test(value)) return value;
        if (/^(\.?\/|\/)/.test(value) || /\.html?($|[?#])/i.test(value)) return new URL(value, location.href).href;
        return `https://${value.replace(/^\/+/, "")}`;
      }

      function hostname(value) {
        try {
          const url = new URL(normalizeUrl(value));
          if (url.origin === location.origin || url.protocol === "file:") {
            return url.pathname.split("/").filter(Boolean).pop() || url.hostname || "demo";
          }
          return url.hostname.replace(/^www\./, "");
        } catch {
          return value;
        }
      }

      function setStatus(text) {
        status.textContent = text;
      }

      function updateText() {
        stageTitle.textContent = titleInput.value.trim() || "Just Thumbnail";
        stageSource.textContent = hostname(urlInput.value.trim() || "example.com");
      }

      function screenMarkup(device = "desktop") {
        if (uploadedImage) return `<img src="${uploadedImage}" alt="">`;
        const src = normalizeUrl(urlInput.value.trim() || "https://example.com");
        const [width, height] = deviceViewports[device] || deviceViewports.desktop;
        return `<iframe src="${src}" width="${width}" height="${height}" data-viewport-width="${width}" data-viewport-height="${height}" loading="lazy" referrerpolicy="no-referrer"></iframe>`;
      }

      function renderResponsive() {
        const devices = responsivePlacements(selectedDevices());
        stage.innerHTML = `
          <div class="stage-brand">JUST-THUMBNAIL</div>
          <h1 class="stage-title" id="stageTitle">${escapeHtml(titleInput.value.trim() || "Just Thumbnail")}</h1>
          <div class="stage-source" id="stageSource">${escapeHtml(hostname(urlInput.value.trim() || "example.com"))}</div>
          ${devices.map((device) => `
          <section class="device ${device.name}" style="left:${device.left}px;top:${device.top}px;width:${device.width}px;height:${device.height}px"><div class="screen">${screenMarkup(device.name)}</div></section>`).join("")}
        `;
      }

      function renderSolo() {
        const soloDevice = preset === "story" || preset === "app" ? "phone" : preset === "square" ? "laptop" : "desktop";
        stage.innerHTML = `
          <div class="stage-brand">JUST-THUMBNAIL</div>
          <section class="solo"><div class="screen">${screenMarkup(soloDevice)}</div></section>
          <h1 class="stage-title" id="stageTitle">${escapeHtml(titleInput.value.trim() || "Just Thumbnail")}</h1>
          <div class="stage-source" id="stageSource">${escapeHtml(hostname(urlInput.value.trim() || "example.com"))}</div>
        `;
      }

      function render() {
        stage.className = `stage ${preset === "responsive" ? "" : preset}`.trim();
        deviceField.style.display = preset === "responsive" ? "grid" : "none";
        const [width, height] = sizes[preset];
        stage.style.width = `${width}px`;
        stage.style.height = `${height}px`;
        stageWrap.style.aspectRatio = `${width} / ${height}`;
        if (preset === "responsive") renderResponsive();
        else renderSolo();
        fitStage();
        scaleIframes();
      }

      function responsivePlacements(names) {
        const all = {
          desktop: { left: 650, top: 145 },
          tablet: { left: 390, top: 635 },
          phone: { left: 775, top: 645 },
          laptop: { left: 955, top: 635 }
        };
        const valid = names.filter((name) => deviceDims[name]);
        if (valid.length === 4) {
          return valid.map((name) => ({ name, ...deviceDims[name], ...all[name] }));
        }

        const single = {
          desktop: { left: 700, top: 285 },
          laptop: { left: 760, top: 380 },
          tablet: { left: 790, top: 360 },
          phone: { left: 895, top: 365 }
        };
        if (valid.length === 1) {
          const name = valid[0];
          return [{ name, ...deviceDims[name], ...single[name] }];
        }

        const hasDesktop = valid.includes("desktop");
        if (valid.length === 2 && hasDesktop) {
          const other = valid.find((name) => name !== "desktop");
          return [
            { name: "desktop", ...deviceDims.desktop, left: 690, top: 165 },
            { name: other, ...deviceDims[other], left: other === "phone" ? 910 : 835, top: 620 }
          ];
        }
        if (valid.length === 3 && hasDesktop) {
          const others = valid.filter((name) => name !== "desktop");
          return [
            { name: "desktop", ...deviceDims.desktop, left: 690, top: 135 },
            { name: others[0], ...deviceDims[others[0]], left: others[0] === "phone" ? 670 : 525, top: 635 },
            { name: others[1], ...deviceDims[others[1]], left: others[1] === "phone" ? 900 : 920, top: 635 }
          ];
        }

        const rowStart = valid.length === 2 ? 610 : 430;
        const gap = valid.length === 2 ? 90 : 55;
        let cursor = rowStart;
        return valid.map((name) => {
          const placement = { name, ...deviceDims[name], left: cursor, top: name === "phone" ? 380 : 360 };
          cursor += deviceDims[name].width + gap;
          return placement;
        });
      }

      function fitStage() {
        const [width, height] = sizes[preset];
        const available = stageWrap.getBoundingClientRect();
        const scale = Math.min(available.width / width, available.height / height, 1);
        stage.style.setProperty("--scale", scale.toFixed(4));
      }

      function scaleIframes() {
        document.querySelectorAll(".screen iframe").forEach((frame) => {
          const screen = frame.parentElement;
          const viewportWidth = Number(frame.dataset.viewportWidth);
          const viewportHeight = Number(frame.dataset.viewportHeight);
          const scale = Math.min(screen.clientWidth / viewportWidth, screen.clientHeight / viewportHeight);
          const left = (screen.clientWidth - viewportWidth * scale) / 2;
          frame.style.width = `${viewportWidth}px`;
          frame.style.height = `${viewportHeight}px`;
          frame.style.transform = `translateX(${left}px) scale(${scale})`;
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      presets.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-preset]");
        if (!button) return;
        preset = button.dataset.preset;
        presets.querySelectorAll("button").forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        render();
      });

      deviceChecks.addEventListener("change", (event) => {
        const checked = [...deviceChecks.querySelectorAll("input:checked")];
        if (checked.length === 0) {
          event.target.checked = true;
        }
        if (preset === "responsive") render();
      });

      document.querySelector("#load").addEventListener("click", () => {
        mode = "url";
        uploadedImage = "";
        render();
        setStatus("URL preview loaded.");
      });

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];
        if (!file) return;
        uploadedImage = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result));
          reader.readAsDataURL(file);
        });
        mode = "image";
        render();
        setStatus("Screenshot loaded.");
      });

      titleInput.addEventListener("input", render);
      urlInput.addEventListener("input", updateText);
      window.addEventListener("resize", () => {
        fitStage();
        scaleIframes();
      });

      document.querySelector("#export").addEventListener("click", async () => {
        if (mode === "image" && uploadedImage) {
          await exportFromCanvas();
          return;
        }
        await exportFromTabCapture();
      });

      async function exportFromCanvas() {
        const [width, height] = sizes[preset];
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        const img = await loadImage(uploadedImage);
        paintBackground(ctx, width, height);
        if (preset === "responsive") paintResponsive(ctx, img);
        else paintSolo(ctx, img, preset);
        canvas.toBlob(downloadBlob, "image/png");
      }

      async function exportFromTabCapture() {
        if (!navigator.mediaDevices?.getDisplayMedia) {
          setStatus("This browser cannot capture the current tab.");
          return;
        }
        setStatus("In the Chrome dialog, choose this Just Thumbnail tab, click Share, then keep this page visible.");
        let stream;
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: "browser", preferCurrentTab: true },
            audio: false
          });
        } catch {
          setStatus("Export canceled. For direct URL output, run thumb <url> locally.");
          return;
        }
        const video = document.createElement("video");
        video.srcObject = stream;
        await video.play();
        await new Promise((resolve) => setTimeout(resolve, 700));
        const rect = stage.getBoundingClientRect();
        const scaleX = video.videoWidth / window.innerWidth;
        const scaleY = video.videoHeight / window.innerHeight;
        const [width, height] = sizes[preset];
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(
          video,
          rect.left * scaleX,
          rect.top * scaleY,
          rect.width * scaleX,
          rect.height * scaleY,
          0,
          0,
          width,
          height
        );
        stream.getTracks().forEach((track) => track.stop());
        canvas.toBlob(downloadBlob, "image/png");
        setStatus("PNG exported.");
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      function paintBackground(ctx, width, height) {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#f8fbff");
        gradient.addColorStop(1, "#e8eef5");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "rgba(35, 178, 109, 0.12)";
        ctx.beginPath();
        ctx.arc(width * 0.28, height * 0.18, width * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(25, 135, 212, 0.12)";
        ctx.beginPath();
        ctx.arc(width * 0.82, height * 0.18, width * 0.22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#173a68";
        ctx.font = "800 16px system-ui";
        ctx.fillText("JUST-THUMBNAIL", 56, 58);
        ctx.fillStyle = "#0c2345";
        ctx.font = "800 54px system-ui";
        wrapText(ctx, titleInput.value.trim() || "Just Thumbnail", 56, 132, 520, 58);
        ctx.fillStyle = "#64748b";
        ctx.font = "650 18px system-ui";
        ctx.fillText(hostname(urlInput.value.trim() || "example.com"), 58, 232);
      }

      function paintResponsive(ctx, img) {
        responsivePlacements(selectedDevices()).forEach((device) => {
          drawDevice(ctx, img, device.left, device.top, device.width, device.height, device.name === "phone" ? 25 : device.name === "laptop" ? 13 : device.name === "tablet" ? 20 : 18);
        });
      }

      function paintSolo(ctx, img, kind) {
        const frames = {
          matrix: [70, 70, 1060, 408, 18],
          og: [541, 98, 558, 316, 18],
          square: [156, 260, 768, 480, 28],
          app: [600, 190, 258, 560, 42],
          story: [188, 510, 704, 1040, 44]
        };
        const [x, y, w, h, r] = frames[kind];
        drawRoundedImage(ctx, img, x, y, w, h, r);
      }

      function drawDevice(ctx, img, x, y, w, h, r) {
        roundedRect(ctx, x, y, w, h, r);
        ctx.fillStyle = "#0b1018";
        ctx.fill();
        drawRoundedImage(ctx, img, x + 13, y + 13, w - 26, h - 26, Math.max(2, r - 8));
      }

      function drawRoundedImage(ctx, img, x, y, w, h, r) {
        ctx.save();
        roundedRect(ctx, x, y, w, h, r);
        ctx.clip();
        const scale = Math.min(w / img.width, h / img.height);
        const dw = img.width * scale;
        const dh = img.height * scale;
        const dx = x + (w - dw) / 2;
        const dy = y + (h - dh) / 2;
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
      }

      function roundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(/\s+/);
        let line = "";
        for (const word of words) {
          const test = line ? `${line} ${word}` : word;
          if (ctx.measureText(test).width > maxWidth && line) {
            ctx.fillText(line, x, y);
            line = word;
            y += lineHeight;
          } else {
            line = test;
          }
        }
        ctx.fillText(line, x, y);
      }

      function downloadBlob(blob) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `just-thumbnail-${preset}.png`;
        a.click();
        URL.revokeObjectURL(a.href);
        setStatus("PNG exported.");
      }

      render();
    </script>
  </body>
</html>
